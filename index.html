<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Opinião: Inteligência Artificial</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent-color);
        }

        .progress-bar {
            height: 6px;
            background-color: #475569;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #334155;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #475569;
            border-color: var(--accent-color);
        }

        .hidden {
            display: none;
        }

        .result-title {
            font-size: 22px;
            text-align: center;
            margin-bottom: 15px;
        }

        .result-desc {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
            color: #cbd5e1;
        }

        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .chart-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-label {
            width: 100px;
            font-size: 14px;
        }

        .chart-bar-bg {
            flex-grow: 1;
            background-color: #334155;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .chart-bar {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 1s ease;
        }

        .chart-value {
            width: 40px;
            font-size: 14px;
            text-align: right;
        }

        .restart-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .restart-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Tela do Quiz -->
    <div id="quiz-screen">
        <h1 id="quiz-title">Opinião sobre IA</h1>
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
        <div id="question" class="question">Carregando pergunta...</div>
        <div id="options" class="options"></div>
    </div>

    <!-- Tela de Resultado -->
    <div id="result-screen" class="hidden">
        <h1 class="result-title">Seu Perfil de Visão sobre IA</h1>
        <div id="result-desc" class="result-desc">Analisando suas respostas...</div>
        
        <div class="chart-container">
            <div class="chart-row">
                <span class="chart-label">Otimista</span>
                <div class="chart-bar-bg"><div id="bar-optimist" class="chart-bar"></div></div>
                <span id="val-optimist" class="chart-value">0%</span>
            </div>
            <div class="chart-row">
                <span class="chart-label">Neutro/Realista</span>
                <div class="chart-bar-bg"><div id="bar-neutral" class="chart-bar"></div></div>
                <span id="val-neutral" class="chart-value">0%</span>
            </div>
            <div class="chart-row">
                <span class="chart-label">Pessimista</span>
                <div class="chart-bar-bg"><div id="bar-pessimist" class="chart-bar"></div></div>
                <span id="val-pessimist" class="chart-value">0%</span>
            </div>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">Responder Novamente</button>
    </div>
</div>

<script>
    const questions = [
        {
            text: "Como você enxerga o impacto da IA no mercado de trabalho no futuro?",
            options: [
                { text: "Vai criar mais empregos e novas oportunidades incríveis.", type: "optimist" },
                { text: "Vai substituir algumas funções, mas os humanos vão se adaptar.", type: "neutral" },
                { text: "Vai gerar desemprego em massa e aumentar a desigualdade.", type: "pessimist" }
            ]
        },
        {
            text: "Em relação à criação artística (arte, textos, música) por IA, você acha que:",
            options: [
                { text: "É uma ferramenta fantástica que expande a criatividade humana.", type: "optimist" },
                { text: "É interessante, mas nunca terá o mesmo valor da arte puramente humana.", type: "neutral" },
                { text: "Desvaloriza os artistas reais e satura o mundo com conteúdo vazio.", type: "pessimist" }
            ]
        },
        {
            text: "Qual o seu maior receio em relação ao avanço rápido da Inteligência Artificial?",
            options: [
                { text: "Não tenho receios, confio no progresso tecnológico.", type: "optimist" },
                { text: "O uso indevido de dados e a perda de privacidade.", type: "neutral" },
                { text: "A perda total de controle humano sobre sistemas autônomos perigosos.", type: "pessimist" }
            ]
        },
        {
            text: "Na sua rotina atual, as ferramentas de IA (como ChatGPT, assistentes virtuais):",
            options: [
                { text: "Melhoraram muito minha produtividade e facilitam minha vida.", type: "optimist" },
                { text: "Uso esporadicamente, ajudam em tarefas bem específicas.", type: "neutral" },
                { text: "Evito usar, prefiro fazer as coisas de forma tradicional.", type: "pessimist" }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let scores = { optimist: 0, neutral: 0, pessimist: 0 };

    function startQuiz() {
        currentQuestionIndex = 0;
        scores = { optimist: 0, neutral: 0, pessimist: 0 };
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        showQuestion();
    }

    function showQuestion() {
        const progress = (currentQuestionIndex / questions.length) * 100;
        document.getElementById('progress').style.width = `${progress}%`;

        if (currentQuestionIndex >= questions.length) {
            showResults();
            return;
        }

        const currentQuestion = questions[currentQuestionIndex];
        document.getElementById('question').innerText = currentQuestion.text;
        
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        currentQuestion.options.forEach(option => {
            const button = document.createElement('button');
            button.innerText = option.text;
            button.classList.add('btn');
            button.onclick = () => selectOption(option.type);
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(type) {
        scores[type]++;
        currentQuestionIndex++;
        showQuestion();
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const total = questions.length;
        const optPercent = Math.round((scores.optimist / total) * 100);
        const neuPercent = Math.round((scores.neutral / total) * 100);
        const pesPercent = Math.round((scores.pessimist / total) * 100);

        // Anima as barras de resultado
        setTimeout(() => {
            document.getElementById('bar-optimist').style.width = `${optPercent}%`;
            document.getElementById('bar-neutral').style.width = `${neuPercent}%`;
            document.getElementById('bar-pessimist').style.width = `${pesPercent}%`;
        }, 100);

        document.getElementById('val-optimist').innerText = `${optPercent}%`;
        document.getElementById('val-neutral').innerText = `${neuPercent}%`;
        document.getElementById('val-pessimist').innerText = `${pesPercent}%`;
